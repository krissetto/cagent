#!/usr/bin/env docker agent run

agents:
  root:
    model: gpt
    description: An agent to demonstrate how to setup a shared todo.
    instruction: |
      Here is your workflow:
        - Use `subagent_start` to dispatch a task to the `first` agent: create a todo
        - Use `subagent_start` to dispatch a task to the `second` agent: what todos do you have?

    subagents:
      - first
      - second

  first:
    model: gpt
    instruction: Use the todos tool to create one random todo item
    toolsets:
      - type: todo
        shared: true

  second:
    model: gpt
    instruction: Get the todos and show them
    toolsets:
      - type: todo
        shared: true

models:
  gpt:
    provider: openai
    model: gpt-4o
