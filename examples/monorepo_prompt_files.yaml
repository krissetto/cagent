agents:
  root:
    model: anthropic/claude-sonnet-4-5
    description: A coding assistant for a monorepo
    instruction: You are an expert software developer.
    toolsets:
      - type: filesystem
    # The closest AGENTS.md found walking up from the working directory is
    # loaded in full, as usual.
    add_prompt_files:
      - AGENTS.md
    # In a monorepo, each sub-project carries its own AGENTS.md that the
    # upward lookup never sees. This scans up to 2 directory levels below the
    # working directory and lists what it finds by path only — contents are
    # not loaded, so the per-turn cost stays proportional to the number of
    # sub-projects, not their size. The agent reads the relevant ones itself:
    #
    #   Prompt files found in subdirectories of /repo. Their contents are NOT loaded:
    #
    #   - services/api/AGENTS.md
    #   - services/web/AGENTS.md
    #
    # Hidden and git-ignored directories are skipped, and the listing is
    # capped at 100 entries.
    add_prompt_files_depth: 2
